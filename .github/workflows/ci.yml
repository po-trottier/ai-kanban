# CI gates in the order defined by docs/dev/testing.md. All actions SHA-pinned.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Verify release versions
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { globSync, readFileSync } from 'node:fs'
          const root = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.match(process.env.RELEASE_TAG, /^v\d+\.\d+\.\d+(?:-[\w.-]+)?$/)
          assert.equal(process.env.RELEASE_TAG, `v${root.version}`, 'release tag must match package.json')
          for (const path of globSync(root.workspaces.map((workspace) => `${workspace}/package.json`))) {
            const manifest = JSON.parse(readFileSync(path, 'utf8'))
            assert.equal(manifest.version, root.version, `${path} version mismatch`)
            for (const [name, version] of Object.entries(manifest.dependencies ?? {})) {
              if (name.startsWith('@rivian-kanban/')) assert.equal(version, root.version, `${path}: ${name} mismatch`)
            }
          }
          NODE
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run depcruise
      - run: npm run knip
      - name: commitlint (PR commits)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to HEAD

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - name: Unit + integration tests with coverage gates
        run: npm run test -- --coverage

  # testing.md CI step 4: build the production image and run the FULL integration suite
  # inside it — catches native-module drift (better-sqlite3/argon2 prebuilds differ between
  # Windows dev and Linux prod). The suite runs via `docker run` of the test stage (not
  # during `docker build`): a cached RUN layer would silently skip the tests, and a run
  # streams output + exit codes reliably. The runtime image then gets a smoke boot:
  # /healthz, /readyz, /version, and the break-glass CLI.
  docker-integration:
    needs: [quality, test, e2e, security, osv-scan]
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate deployment configuration
        env:
          POSTGRES_PASSWORD: ci-config-check
        run: docker compose config --quiet
      - name: Build the test stage (production build + dev deps)
        run: docker build --target test -t rivian-kanban-test .
      - name: Run the integration suite inside the image
        run: docker run --rm rivian-kanban-test
      - name: Build the runtime image (reuses the build-stage cache)
        run: |
          version="$(node -p 'require("./package.json").version')"
          docker build -t rivian-kanban \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${version}" \
            --build-arg APP_VERSION="${version}" \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" .
      - name: Smoke-boot the runtime image
        run: |
          docker network create rk-smoke
          docker run -d --name rk-smoke-postgres --network rk-smoke \
            -e POSTGRES_USER=rivian -e POSTGRES_DB=rivian -e POSTGRES_PASSWORD=ci-smoke-password postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec rk-smoke-postgres pg_isready -U rivian -d rivian && break
            sleep 1
          done
          docker run -d --name app --network rk-smoke -p 3000:3000 -v rk-smoke-data:/data \
            -e DATABASE_URL=postgres://rivian:ci-smoke-password@rk-smoke-postgres:5432/rivian rivian-kanban
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:3000/healthz
          curl -fsS http://localhost:3000/readyz
          curl -fsS http://localhost:3000/version | jq -e \
            --arg version "$(node -p 'require("./package.json").version')" \
            --arg sha "$GITHUB_SHA" '.version == $version and .gitSha == $sha'
          # Structural seed ran at boot; the break-glass CLI works in-image.
          docker exec app node dist/cli.js users create-admin --email ci-smoke@example.com
          admin_count="$(docker exec rk-smoke-postgres psql -U rivian -d rivian -tAc \
            "SELECT count(*) FROM users WHERE email = 'ci-smoke@example.com'")"
          test "$admin_count" = 1
          docker rm -f app rk-smoke-postgres
          docker volume rm rk-smoke-data
          docker network rm rk-smoke
      - name: Scan the runtime image for known vulnerabilities
        run: |
          curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz -o trivy.tar.gz
          echo '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  trivy.tar.gz' | sha256sum --check
          tar -xzf trivy.tar.gz trivy
          ./trivy image --scanners vuln --format json --output image-vulnerabilities.json rivian-kanban
          ./trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 rivian-kanban
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: image-vulnerabilities
          path: image-vulnerabilities.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish tested image to GitHub Container Registry
        if: github.event_name == 'release' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=("sha-${GITHUB_SHA}")
          if [[ -n "$RELEASE_TAG" ]]; then
            tags+=("$RELEASE_TAG" "${RELEASE_TAG#v}")
            if [[ "$PRERELEASE" == 'false' ]]; then
              latest_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
              if [[ "$latest_release" == "$RELEASE_TAG" ]]; then tags+=(latest); fi
            fi
          else
            tags+=(main)
          fi
          for tag in "${tags[@]}"; do
            docker tag rivian-kanban "${image}:${tag}"
            docker push "${image}:${tag}"
            docker buildx imagetools inspect "${image}:${tag}"
          done
          docker pull "${image}:sha-${GITHUB_SHA}"

  # The e2e job stays on dev-mode source: rewiring it onto the production image needs an
  # explicit credential strategy because SEED_DEMO_PASSWORD is (deliberately) refused in
  # production mode. The docker-integration job above is the image gate in the meantime.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npx playwright install --with-deps chromium
      # The playwright config builds the SPA and boots the real server itself.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: gitleaks (pinned CLI, not the proprietary action)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact .

  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=package-lock.json
      upload-sarif: false
    permissions:
      # The called workflow declares security-events: write at its top level; a caller must
      # grant at least what the callee declares or the run fails at startup validation —
      # even though upload-sarif=false means it is never used.
      contents: read
      actions: read
      security-events: write
